[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-audio-converter"
version = "1.2.1"
description = "DTS to AC3 batch conversion with a native Qt GUI and MKVToolNix remuxing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7"]
license = {text = "MIT"}

[project.scripts]
mkv-audio-converter = "mkv_audio_converter.__main__:main"

[tool.setuptools.packages.find]
include = ["mkv_audio_converter*"]
