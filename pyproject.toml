[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mkv-audio-converter"
version = "1.3.0"
description = "DTS to AC3 batch conversion with a native Qt GUI and MKVToolNix remuxing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.7,<7"]
license = "MIT AND LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "LICENSES/*.md"]

[project.urls]
Homepage = "https://github.com/Fry747/mkv-audio-converter"
Repository = "https://github.com/Fry747/mkv-audio-converter"
Issues = "https://github.com/Fry747/mkv-audio-converter/issues"

[project.scripts]
mkv-audio-converter = "mkv_audio_converter.__main__:main"

[tool.setuptools.packages.find]
include = ["mkv_audio_converter*"]

[tool.setuptools.package-data]
mkv_audio_converter = ["assets/*.png", "assets/*.ico", "assets/*.svg", "assets/*.md"]
