name: Windows build and test
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Record build environment
        shell: pwsh
        run: |
          "Runner: $env:RUNNER_OS $env:RUNNER_ARCH; commit: $env:GITHUB_SHA" | Set-Content windows-environment.log
          $PSVersionTable | Out-String | Add-Content windows-environment.log
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.13.17'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-build.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          Start-Transcript -Path windows-dependencies.log
          try {
            python -m pip install -r packaging/windows/requirements-build.txt
            if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed' }
          } finally { Stop-Transcript }
      - name: Set up pinned upstream tools and expose them to media tests
        shell: pwsh
        run: |
          Start-Transcript -Path windows-tools-setup.log
          try {
            python -m mkv_audio_converter --setup-tools
            if ($LASTEXITCODE -ne 0) { throw 'Tool setup failed' }
            python -c "from mkv_audio_converter.runtime import configured_tools; import os; from pathlib import Path; paths=sorted({str(p.parent) for p in configured_tools().values()}); f=Path(os.environ['GITHUB_PATH']); f.open('a',encoding='utf-8').write('\n'.join(paths)+'\n')"
            if ($LASTEXITCODE -ne 0) { throw 'Exposing tool paths failed' }
          } finally { Stop-Transcript }
      - name: Native Windows tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> windows-tests.log
          $testExit = $LASTEXITCODE
          Get-Content windows-tests.log
          if ($testExit -ne 0) { throw 'Windows tests failed' }
      - name: Build portable ZIP and per-user installer
        shell: pwsh
        run: |
          Start-Transcript -Path windows-build.log
          try { ./packaging/windows/build-windows.ps1 } finally { Stop-Transcript }
      - name: Frozen EXE smoke tests (also checks DLL isolation)
        shell: pwsh
        run: |
          Start-Transcript -Path windows-frozen-smoke.log
          try {
            $env:QT_QPA_PLATFORM = 'offscreen'
            .\.venv-build\Scripts\python.exe packaging/windows/smoke.py dist/MKVAudioConverter
            if ($LASTEXITCODE -ne 0) { throw 'Frozen smoke test failed' }
          } finally { Stop-Transcript }
      - name: Silent installer and non-destructive uninstall smoke test
        shell: pwsh
        run: ./packaging/windows/installer-smoke.ps1
      - name: Keep diagnostic logs (including early setup failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: windows-test-logs
          path: |
            windows-environment.log
            windows-dependencies.log
            windows-tools-setup.log
            windows-tests.log
            windows-build.log
            windows-frozen-smoke.log
            windows-installer.log
          if-no-files-found: warn
      - name: Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: MKVAudioConverter-windows-x64
          path: dist/windows/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: MKVAudioConverter-windows-x64
          path: release-assets
      - name: Verify complete release set and tagged source contents
        run: python3 tools/verify_release.py release-assets "${RELEASE_TAG#v}"
      - name: Create draft and upload the five files without replacing existing assets
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "MKV Audio Converter ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md" release-assets/*
          printf '\n\nGeprüfter Tag-Build: %s/%s/actions/runs/%s\nCommit: `%s`\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Download release assets again and verify all five uploaded bytes
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          python3 tools/verify_release.py downloaded-assets "${RELEASE_TAG#v}"
          for asset in release-assets/*; do cmp "$asset" "downloaded-assets/$(basename "$asset")"; done
          printf 'Release draft: %s/%s/releases\nAll five uploads match the build byte for byte.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the superseded pre-release Windows binary artifact
        if: github.ref_name == 'v1.3.0'
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" > artifacts.json
          python3 - <<'PY'
          import json, os, subprocess
          for artifact in json.load(open('artifacts.json'))['artifacts']:
              if artifact['id'] == 12735821690:
                  assert artifact['name'] == 'MKVAudioConverter-windows-x64'
                  assert artifact['workflow_run']['head_sha'] == 'd53d7a97ffca2463010aa9b389c26fff7295c6d3'
                  subprocess.run(['gh', 'api', '--method', 'DELETE',
                                  f"repos/{os.environ['GH_REPO']}/actions/artifacts/{artifact['id']}"], check=True)
                  print('Removed superseded pre-release binary artifact', artifact['id'])
          PY
